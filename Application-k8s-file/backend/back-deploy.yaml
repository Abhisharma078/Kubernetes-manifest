apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-deploy
  labels:
    app: back
spec:  
  replicas: 2
  selector:
    matchLabels:
      app: back
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      name: back-deploy-temp
      labels:
        app: back
    spec:
      containers:
       - name: backend-cont
         image: #your ecs image url ya jo bhi practical ki image main hogi vo 
         ports:
         - containerPort: 8080

         resources:
           requests:
             cpu: "100m"
             memory: "64Mi"
           limits:
             cpu: "200m"
             memory: "128Mi"