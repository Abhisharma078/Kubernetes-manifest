apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: 
  name: fron-hpa
  labels:
    app: fron
spec: 
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fron-deploy
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: CPU
      target:
        type: Utilization
        averageUtilization: 50