apiVersion: v1
kind: Namespace
metadata:
  name: apache
---
apiVersion: v1
kind: Service
metadata:
  name: apache-svc
  labels:
    app: apache
  namespace: apache
spec:
  type: NodePort
  selector:
    app: apache
  ports: 
   - name: apache-port
     port: 80
     targetPort: 80
     protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deploy
  labels:
    app: apache
  namespace: apache
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: apache
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      name: apache-temp
      labels:
        app: apache
    spec:
      containers:
       - name: apache-cont
         image: httpd:latest
         ports:
          - containerPort: 80
        
         resources:
           requests:
             cpu: "100m"
             memory: '64Mi'
           limits: 
             cpu: "200m"
             memory: "128Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apache-hpa
  labels:
    app: apache
  namespace: apache
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apache-deploy
  minReplicas: 2
  maxReplicas: 5
  metrics:
   - type: Resource
     resource:
       name: cpu
       target:
         type: Utilization
         averageUtilization: 50