apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
  labels:
    app: nginx
  namespace: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      name: nginx-temp
      labels:
        app: nginx
    spec:
      containers:
       - name: nginx-cont
         image: nginx:latest
         ports:
          - containerPort: 80

         resources:
           requests:
             cpu: "100m"
             memory: "64Mi"
           limits:
             cpu: "200m"
             memory: "128Mi"

          