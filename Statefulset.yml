apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-stat
  labels:
    app: state
spec:
  replicas: 2
  selector:
    matchLabels:
      app: state
  template:
    metadata:
      name: state-temp
      labels:
        app: state
    spec:
      containers:
       - name: mysql-cont
         image: mysql:8.0
         ports:
          - containerPort: 3306
         
         resources:
           requests:
             cpu: "100m"
             memory: "64Mi"
           limits:
             cpu: "100m"
             memory: "128Mi"
         
         env:
         - name: MYSQL_ROOT_PASSWORD
           value: root
         - name: MYSQL_USER
           value: "admin"
         - name: MYSQL_PASSWORD
           value: "admin"
         - name: MYSQL_DATABASE
           value: "student_db"
