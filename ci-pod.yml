apiVersion: v1
kind: Pod
metadata:
   name: my-pod
   labels:
      app: ci
spec:
   containers:
     - name: nginx-cont
       image: nginx:latest
       ports:
          - containerPort: 80
...
---
apiVersion: v1
kind: Service
metadata:
   name: my-svc
   labels:
      app: ci
spec:
   type: ClusterIP
   selector:
      app: ci
   ports:
         - protocol: TCP
           port: 80
           targetPort: 80

