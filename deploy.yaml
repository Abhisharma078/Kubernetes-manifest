apiversion: apps/v1
kind: Deployment
metadata: 
  name: my-deploy
  labels:
    app: deploy
spec:
  replicas: 3
  selector: 
    matchLabels:
       app: deploy
  strategy: 
    type: RollingUpdate
    rollingUpdate:
       maxSurge: 1
       maxUnavailabel: 2
    template:
      metadata:
         labels:
           app: deploy
    spec:
      containers: 
        - name: apache-cont
          image: httpd:latest
          ports:
           - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: deploy-svc
  labels:
    app: deploy
spec:
  type: NodePort
  selector:
    app: deploy
  ports:
   - protocol: TCP
     port: 80
     targetPort: 80
     nodePort: 32222           