apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-deploy
  labels:
    app: home
spec:
  replicas: 2
  selector:
    matchLabels:
      app: home
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      name: my-deploy-temp
      labels:
        app: home
    spec:
      containers:
       - name: nginx-cont
         image: nginx:latest
         ports:
         - containerPort: 80

         resources:
           requests:
              cpu: "100m"
              memory: "64Mi"
           limits:
             cpu: "200m"
             memory: "128Mi"

             
           
  
          
      
        