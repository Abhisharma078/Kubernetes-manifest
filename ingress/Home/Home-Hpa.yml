apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: home-hpa
  labels:
    app: home
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: home-deploy
  minReplicas: 3
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
      
        
