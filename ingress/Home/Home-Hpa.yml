apiVersion: autoscalling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: home-hpa
  labels:
    app: home
spec:
  scaleTargetRef:
    apiVersion: apps:v1
    kind: Deployment
    name: home-deploy
  minReplicas: 3
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
    - name: CPU
      target:
        type: Utilization
        avergeUtilization: 50
      
        
