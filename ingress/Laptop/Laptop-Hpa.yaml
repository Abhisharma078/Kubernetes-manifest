apiVersion: AutoScalling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: laptop-hpa
  labels:
    app: laptop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployemnt
    name: laptop-deploy
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: CPU
      target:
        type: Utilization
        avergeUtilization: 50

