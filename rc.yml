apiVersion: v1
kind: ReplicationController
metadata:
   name: my-rc
   labels:
     app: rc
spec:
  replicas: 4
  selector:
     app: rc
  template:
    metadata: 
      name: rc-temp
      labels: 
        app: rc
  spec:
    containers:
      - name: nginx-cont
        image: nginx:latest
        ports: 
         - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
   name: rc-svc
   labels:
     app: rc
spec:
  type: NodePort
  selector:
     app: rc
  ports:
    - name: rc-port
      protocol: TCP
      port: 80
      targetPort: 80
