apiVersion: apps/v1
kind: ReplicaSet
metadata:
   name: my-rs
   labels:
     app: rs
spec:
  replicas: 5
  selector:
    matchLabels:
       app: rs
  template:
    metadata:
      labels:
       app: rs
    spec:
      containers:
       - name: nginx-cont
         image: nginx:latest
         ports:
           - containerPort: 80
---
apiVersion: v1
kind: Service
metadata: 
  name: rs-svc
  labels: 
    app: rs
spec:
  selector:
    app: rs
  type: NodePort 
  ports: 
   - name: rs-port
     protocol: TCP
     port: 80
     targetPort: 80 