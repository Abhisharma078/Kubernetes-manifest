apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-deploy
  labels: 
    app: student
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailble: 1
  selector:
    matchLabels:
      app: student
  template:
    metadata: 
      name: student-deploy-temp
      labels:
        app: student
    spec:
      containers:
       - name: student-cont
         image: 822920903800.dkr.ecr.ap-south-1.amazonaws.com/students
         ports:
          - containerPort: 8080

         resources:
           requests:
             cpu: "100m"
             memory: "64Mi"
           limits:
             cpu: "200"
             memory: "128Mi"
             
